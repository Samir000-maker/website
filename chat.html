

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chat - MoodLog</title>

  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#8b5cf6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#8b5cf6",
            "background-dark": "#121417",
            "surface-dark": "#1e2124",
            "accent-purple": "#8b5cf6",
            "accent-teal": "#2DD4BF",
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --bg-dark: #121417;
      --bg-card: #1e2124;
      --bg-card-hover: #252846;
      --border-dark: #2a2d3a;
      --text-primary: #ffffff;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --accent-purple: #8b5cf6;
      --accent-purple-light: #a78bfa;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    header {
      border-bottom: 1px solid var(--border-dark);
      background: rgba(18, 20, 23, 0.95);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 50;
      flex-shrink: 0;
    }

    .header-content {
      max-width: 100%;
      margin: 0 auto;
      display: flex;
      height: 60px;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 60;
      display: none;
    }
    .sidebar-overlay.active { display: block; }

    .sidebar {
      position: fixed;
      top: 0;
      left: -300px;
      width: 300px;
      height: 100%;
      background: rgba(18, 20, 23, 0.98);
      border-right: 1px solid var(--border-dark);
      z-index: 70;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(10px);
    }
    .sidebar.show { left: 0; }

    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
    }

    #messagesList {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .composer-bar {
      border-top: 1px solid var(--border-dark);
      background: rgba(18, 20, 23, 0.95);
      padding: 12px 16px;
      flex-shrink: 0;
    }

    #messageForm {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      resize: none;
      max-height: 120px;
      line-height: 1.4;
    }
    #messageInput::placeholder { color: var(--text-muted); }
    #messageInput:focus { border-color: var(--accent-purple); }

    .chat-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.06);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .chat-btn:hover { background: rgba(255,255,255,0.10); color: var(--text-primary); }
    .chat-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .chat-btn.call-ready { color: var(--accent-purple); border-color: rgba(139,92,246,0.3); }
    .chat-btn.call-ready:hover { background: rgba(139,92,246,0.15); }

    .typing-indicator {
      padding: 4px 16px;
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
      min-height: 24px;
      flex-shrink: 0;
    }

    .reply-preview {
      padding: 8px 16px;
      background: rgba(139,92,246,0.08);
      border-top: 1px solid rgba(139,92,246,0.15);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      flex-shrink: 0;
    }

    .hidden { display: none !important; }

    /* Incoming call modal */
    #incomingCallModal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
    }

    /* Emoji picker */
    #emojiPickerOverlay {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    #emojiPickerOverlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    #emojiSearchInput {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
      font-family: inherit;
    }

    /* Image viewer */
    #imageViewerOverlay {
      position: fixed;
      inset: 0;
      z-index: 95;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
    }
    #imageViewerOverlay.active { display: flex; }

    /* Call iframe */
    #callIframeContainer {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: #000;
    }

    /* Attachment preview */
    #attachmentPreview {
      border-top: 1px solid var(--border-dark);
      padding: 8px 16px;
      background: rgba(139,92,246,0.06);
    }

    /* Loading overlay */
    #chatLoadingOverlay { z-index: 99999; }

    @media (max-width: 640px) {
      .header-content { height: 52px; padding: 0 12px; }
      #messagesList { padding: 8px; }
      .composer-bar { padding: 8px 10px; }
    }
  </style>
  <link rel="stylesheet" href="fluid-bg.css">
</head>

<body class="dark">
<script src="fluid-bg.js"></script>

<!-- Contact Support Modal -->
<div id="contactSupportModal" class="hidden" style="position: fixed; inset: 0; z-index: 70; align-items: center; justify-content: center;">
  <div data-close="1" style="position: absolute; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);"></div>
  <div style="position: relative; width: 92vw; max-width: 420px; border-radius: 16px; background: rgba(30, 33, 57, 0.95); border: 1px solid rgba(255, 255, 255, 0.10); box-shadow: 0 20px 60px rgba(0,0,0,0.45); padding: 20px;">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
      <div>
        <div style="font-size: 16px; font-weight: 800;">Contact support</div>
        <div style="margin-top: 4px; font-size: 13px; color: var(--text-secondary);">Email us and we'll get back to you.</div>
      </div>
      <button type="button" data-close="1" style="background: transparent; border: none; color: var(--text-secondary); cursor: pointer;">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div style="margin-top: 14px; display: flex; align-items: center; gap: 8px; border-radius: 12px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08); padding: 12px 12px;">
      <span id="contactSupportEmail" style="font-size: 14px; font-weight: 700; user-select: all;">contact@vibegra.com</span>
      <button id="contactSupportCopyBtn" type="button" style="margin-left: auto; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); padding: 8px 10px; cursor: pointer; color: rgba(255,255,255,0.9);">
        <span class="material-symbols-outlined" style="font-size: 18px;">content_copy</span>
      </button>
    </div>
    <div id="contactSupportCopyHint" class="hidden" style="margin-top: 8px; font-size: 12px; color: var(--text-muted);">Copied</div>
  </div>
</div>

<!-- Profile Settings Modal -->
<div id="profileSettingsModal" class="hidden" style="position: fixed; inset: 0; z-index: 80; align-items: center; justify-content: center;">
  <div data-close="1" style="position: absolute; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(6px);"></div>
  <div style="position: relative; width: 92vw; max-width: 560px; border-radius: 18px; background: rgba(15, 17, 21, 0.96); border: 1px solid rgba(255, 255, 255, 0.10); box-shadow: 0 22px 70px rgba(0,0,0,0.55); padding: 20px;">
    <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
      <div>
        <div style="font-size:16px; font-weight:900; letter-spacing:-0.01em;">Profile settings</div>
        <div style="margin-top:4px; font-size:13px; color: var(--text-secondary);">Update your username and profile picture.</div>
      </div>
      <button type="button" data-close="1" style="background: transparent; border: none; color: var(--text-secondary); cursor: pointer;">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div style="margin-top:16px; display:grid; grid-template-columns: 180px 1fr; gap:16px;">
      <div style="display:flex; flex-direction:column; gap:10px; align-items:center; justify-content:flex-start;">
        <div id="profileModalAvatar" style="width: 160px; height: 160px; border-radius: 9999px; overflow:hidden; border: 2px solid rgba(255,255,255,0.10); background: rgba(30,33,57,0.75); display:flex; align-items:center; justify-content:center;">
          <div id="profileModalAvatarFallback" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:40px; color:#16172b; background: linear-gradient(135deg, #a78bfa 0%, #6366f1 100%);">U</div>
          <img id="profileModalAvatarImg" class="hidden" alt="Profile preview" style="width:100%; height:100%; object-fit:cover; display:block;" />
        </div>
        <label for="profileModalFileInput" style="width:100%; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 12px; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); color: rgba(255,255,255,0.9); cursor:pointer; font-weight:800; font-size:13px;">
          <span class="material-symbols-outlined" style="font-size:18px; color: rgba(167, 139, 250, 0.95);">photo_camera</span>
          Choose photo
        </label>
        <input id="profileModalFileInput" type="file" accept="image/*" class="hidden" />
        <div style="font-size:12px; color: var(--text-muted); text-align:center;">PNG/JPG, max 5MB</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <div>
          <div style="font-size:12px; font-weight:900; letter-spacing:0.12em; text-transform:uppercase; color: var(--text-muted); margin-left:4px;">Username</div>
          <div style="margin-top:8px; display:flex; align-items:center; gap:10px; border-radius: 14px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.10); padding: 12px 12px;">
            <span style="color: rgba(255,255,255,0.45); font-weight:900;">@</span>
            <input id="profileModalUsername" type="text" maxlength="20" style="flex:1; background: transparent; border: none; outline: none; color: rgba(255,255,255,0.92); font-weight:800; font-family: inherit;" placeholder="your_username" />
            <span id="profileModalUsernameStatus" style="font-size:12px; color: rgba(255,255,255,0.55);"></span>
          </div>
          <div id="profileModalUsernameHint" style="margin-top:8px; font-size:12px; color: var(--text-secondary);"></div>
        </div>
        <div style="display:flex; gap:10px; margin-top:4px;">
          <button type="button" id="profileModalCancelBtn" style="flex:1; padding:12px 12px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10); color: rgba(255,255,255,0.9); font-weight:900; cursor:pointer; font-family: inherit;">Cancel</button>
          <button type="button" id="profileModalSaveBtn" style="flex:1; padding:12px 12px; border-radius: 14px; background: linear-gradient(135deg, #2dd4bf 0%, #14b8a6 100%); border: none; color: #04120e; font-weight:900; cursor:pointer; font-family: inherit;">Save</button>
        </div>
        <div id="profileModalError" class="hidden" style="margin-top:4px; padding: 10px 12px; border-radius: 14px; background: rgba(239,68,68,0.10); border: 1px solid rgba(239,68,68,0.25); color: rgba(239,68,68,0.92); font-weight:800; font-size:12px;"></div>
      </div>
    </div>
  </div>
</div>

<!-- Sidebar Overlay -->
<div id="sidebarOverlay" class="sidebar-overlay"></div>

<!-- Sidebar -->
<div id="sidebar" class="sidebar">
  <div style="display:flex; align-items:center; justify-content:space-between; padding:16px; border-bottom:1px solid var(--border-dark);">
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="material-symbols-outlined" style="color: var(--accent-purple-light);">group</span>
      <span style="font-weight:700; font-size:15px;">Online</span>
      <span id="onlineCount" style="font-size:12px; color: var(--text-muted);">0</span>
    </div>
    <button id="sidebarClose" type="button" class="chat-btn" style="width:32px;height:32px;">
      <span class="material-symbols-outlined" style="font-size:18px;">close</span>
    </button>
  </div>
  <div id="usersList" style="flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:8px;">
    <!-- Users loaded by JS -->
  </div>
</div>

<!-- Header -->
<header>
  <div class="header-content">
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="sidebarToggle" type="button" class="chat-btn" style="width:36px;height:36px;">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div>
        <div id="chatHeaderTitle" style="font-weight:700; font-size:15px;">Chat Room</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:6px;">
      <button id="audioCallBtn" type="button" class="chat-btn" disabled title="Start Audio Call">
        <span class="material-symbols-outlined">call</span>
      </button>
      <button id="videoCallBtn" type="button" class="chat-btn" disabled title="Start Video Call">
        <span class="material-symbols-outlined">videocam</span>
      </button>
      <button id="joinCallBtn" type="button" class="chat-btn hidden" disabled title="Join Call">
        <span class="material-symbols-outlined">login</span>
        <span class="hidden sm:inline" style="font-size:12px; font-weight:600; margin-left:4px;">Join Call</span>
        <span class="sm:hidden" style="font-size:12px; font-weight:600; margin-left:4px;">Join</span>
      </button>
      <button id="leaveBtn" type="button" class="chat-btn" style="color:rgba(239,68,68,0.7);" title="Leave room">
        <span class="material-symbols-outlined">logout</span>
      </button>
      <!-- Profile -->
      <div class="user-menu" id="userMenu" style="position:relative; display:flex; align-items:center;">
        <button type="button" class="profile-icon-btn" id="profileIconBtn" style="width:36px;height:36px;border-radius:9999px;border:2px solid rgba(255,255,255,0.08);background:rgba(30,33,57,0.75);overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;">
          <div class="profile-icon-fallback" id="profileIconFallback" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#16172b;background:linear-gradient(135deg,#a78bfa 0%,#6366f1 100%);font-size:12px;">U</div>
          <img class="profile-icon-img hidden" id="profileIconImg" alt="Profile" style="width:100%;height:100%;object-fit:cover;display:none;" />
        </button>
        <div class="profile-menu" id="profileMenu" role="menu" aria-label="Profile menu" style="position:absolute;top:calc(100%+8px);right:0;width:200px;background:rgba(30,33,57,0.98);border:1px solid rgba(255,255,255,0.10);border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,0.45);padding:8px;z-index:300;backdrop-filter:blur(10px);opacity:0;transform:translateY(6px) scale(0.97);pointer-events:none;transition:opacity 0.18s,transform 0.18s;">
          <button type="button" id="menuChangePfp" role="menuitem" style="width:100%;display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:transparent;border:none;color:rgba(255,255,255,0.92);cursor:pointer;font-size:13px;font-weight:700;text-align:left;transition:background 0.15s;font-family:inherit;">
            <span class="material-symbols-outlined" style="font-size:18px;color:rgba(167,139,250,0.95);">photo_camera</span>
            <span>Change profile picture</span>
          </button>
          <button type="button" id="menuChangeUsername" role="menuitem" style="width:100%;display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:transparent;border:none;color:rgba(255,255,255,0.92);cursor:pointer;font-size:13px;font-weight:700;text-align:left;transition:background 0.15s;font-family:inherit;">
            <span class="material-symbols-outlined" style="font-size:18px;color:rgba(167,139,250,0.95);">badge</span>
            <span>Change username</span>
          </button>
          <div style="height:1px;background:rgba(255,255,255,0.07);margin:6px 4px;"></div>
          <button type="button" id="logoutBtn" role="menuitem" class="menu-logout" style="width:100%;display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:transparent;border:none;color:rgba(248,113,113,0.92);cursor:pointer;font-size:13px;font-weight:700;text-align:left;transition:background 0.15s;font-family:inherit;">
            <span class="material-symbols-outlined" style="font-size:18px;color:rgba(248,113,113,0.9);">logout</span>
            <span>Logout</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Chat Main Area -->
<div class="chat-main">
  <div id="messagesList">
    <!-- Messages rendered by JS -->
  </div>

  <!-- Typing Indicator -->
  <div id="typingIndicator" class="typing-indicator hidden">
    <span id="typingText"></span>
  </div>

  <!-- Reply Preview -->
  <div id="replyPreview" class="reply-preview hidden">
    <span class="material-symbols-outlined" style="font-size:16px;color:var(--accent-purple-light);">reply</span>
    <span id="replyPreviewText" style="flex:1;color:var(--text-secondary);"></span>
    <button id="cancelReplyBtn" type="button" style="background:none;border:none;color:var(--text-muted);cursor:pointer;">
      <span class="material-symbols-outlined" style="font-size:16px;">close</span>
    </button>
  </div>

  <!-- Attachment Preview -->
  <div id="attachmentPreview" class="hidden">
    <div style="display:flex;align-items:center;gap:10px;">
      <div id="attachmentIconWrapper" class="attachment-icon-wrapper" style="width:40px;height:40px;border-radius:8px;background:rgba(139,92,246,0.1);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;"></div>
      <div style="flex:1;min-width:0;">
        <div id="attachmentName" style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></div>
        <div id="attachmentSize" style="font-size:11px;color:var(--text-muted);margin-top:2px;"></div>
      </div>
      <button id="cancelAttachmentBtn" type="button" style="background:none;border:none;color:var(--text-muted);cursor:pointer;">
        <span class="material-symbols-outlined" style="font-size:18px;">close</span>
      </button>
    </div>
    <div id="uploadProgressText" style="font-size:11px;color:var(--accent-purple-light);margin-top:4px;text-align:center;"></div>
  </div>

  <!-- Composer -->
  <div class="composer-bar">
    <div id="composerBar">
      <form id="messageForm">
        <button id="emojiBtn" type="button" class="chat-btn emoji-btn" title="Add emoji">
          <span class="material-symbols-outlined">emoji_emotions</span>
        </button>
        <button id="attachmentBtn" type="button" class="chat-btn" title="Attach file">
          <span class="material-symbols-outlined">attach_file</span>
        </button>
        <input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off" />
        <button id="sendMessageBtn" type="submit" class="chat-btn" disabled title="Send message" style="color:var(--accent-purple);">
          <span class="material-symbols-outlined">send</span>
        </button>
      </form>
    </div>
  </div>
</div>

<!-- Emoji Picker -->
<div id="emojiPickerOverlay">
  <div style="position:relative;width:92vw;max-width:380px;max-height:70vh;border-radius:18px;background:rgba(22,23,43,0.98);border:1px solid rgba(255,255,255,0.10);box-shadow:0 22px 70px rgba(0,0,0,0.55);display:flex;flex-direction:column;overflow:hidden;">
    <div style="padding:16px;border-bottom:1px solid var(--border-dark);">
      <input id="emojiSearchInput" type="text" placeholder="Search emojis..." />
    </div>
    <div id="emojiCategories" style="display:flex;gap:4px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--border-dark);flex-shrink:0;"></div>
    <div id="emojiGrid" style="flex:1;overflow-y:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;"></div>
  </div>
</div>

<!-- Image Viewer -->
<div id="imageViewerOverlay" onclick="if(event.target===this)closeImageViewer()">
  <div style="position:relative;max-width:90vw;max-height:90vh;display:flex;flex-direction:column;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;color:var(--text-secondary);">
      <span id="imageViewerFilename" style="font-size:13px;font-weight:600;"></span>
      <span id="imageViewerSize" style="font-size:12px;"></span>
    </div>
    <img id="imageViewerImage" style="max-width:90vw;max-height:80vh;border-radius:12px;cursor:zoom-in;object-fit:contain;" />
  </div>
</div>

<!-- Incoming Call Modal -->
<div id="incomingCallModal" class="hidden">
  <div style="position:relative;width:92vw;max-width:340px;border-radius:20px;background:rgba(22,23,43,0.98);border:1px solid rgba(255,255,255,0.10);box-shadow:0 22px 70px rgba(0,0,0,0.55);padding:28px 24px;text-align:center;">
    <div id="callerAvatar" style="width:80px;height:80px;border-radius:9999px;margin:0 auto 12px;overflow:hidden;border:2px solid rgba(139,92,246,0.3);display:flex;align-items:center;justify-content:center;">
      <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;color:#16172b;background:linear-gradient(135deg,#a78bfa 0%,#6366f1 100%);">?</div>
    </div>
    <div id="callerName" style="font-weight:700;font-size:16px;margin-bottom:4px;"></div>
    <div id="callType" style="font-size:13px;color:var(--text-secondary);margin-bottom:20px;"></div>
    <div style="display:flex;gap:16px;justify-content:center;">
      <button id="declineCallBtn" type="button" style="width:56px;height:56px;border-radius:9999px;border:none;background:rgba(239,68,68,0.2);color:#ef4444;cursor:pointer;display:flex;align-items:center;justify-content:center;">
        <span class="material-symbols-outlined" style="font-size:28px;">call_end</span>
      </button>
      <button id="acceptCallBtn" type="button" style="width:56px;height:56px;border-radius:9999px;border:none;background:rgba(34,197,94,0.2);color:#22c55e;cursor:pointer;display:flex;align-items:center;justify-content:center;">
        <span class="material-symbols-outlined" style="font-size:28px;">call</span>
      </button>
    </div>
  </div>
</div>

<!-- Call Iframe Container -->
<div id="callIframeContainer" class="hidden" style="position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column;">
  <iframe id="callIframe" style="flex:1;border:none;width:100%;height:100%;" allow="camera;microphone;display-capture;autoplay" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>
</div>

<!-- Floating Return to Call -->
<button id="floatingReturnToCall" type="button" class="hidden" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:85;display:flex;align-items:center;gap:8px;padding:12px 20px;border-radius:9999px;background:rgba(139,92,246,0.9);border:none;color:white;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 8px 32px rgba(139,92,246,0.4);">
  <span class="material-symbols-outlined" style="font-size:18px;">call</span>
  <span>Return to Call</span>
</button>

<!-- File input (hidden) -->
<input id="fileInput" type="file" class="hidden" />

<script src="/env-config.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>

<!-- Socket.IO Client -->
<script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>

<script src="app.js"></script>

</body>
